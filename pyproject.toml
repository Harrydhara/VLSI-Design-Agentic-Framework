[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlsi-agent"
version = "0.1.0"
description = "Agentic VLSI design toolkit: LLM-generated Verilog checked with Icarus Verilog and Yosys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["gradio>=5,<6", "plotly>=5"]
mlx = ["mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'"]  # the model server on Apple silicon

[project.scripts]
vlsi-agent = "vlsi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real EDA tools and/or a running model server (Ollama or MLX)",
    "ollama: needs a running model server (Ollama or MLX) with the model (deselect with -m \"not ollama\")",
]
