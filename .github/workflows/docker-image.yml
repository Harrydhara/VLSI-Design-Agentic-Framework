# Builds the app image, tests it, and publishes it to the GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest        every push to main
#   ghcr.io/<owner>/<repo>:sha-<commit>  every build
#   ghcr.io/<owner>/<repo>:v1.0          git tags starting with v
# The first build compiles Yosys from source (expect ~20 minutes on GitHub's runners);
# later builds reuse the cached layers unless the Dockerfile's early steps change.
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore: ["runs/**", "docs/**"]  # run outputs and reports are not in the image
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # publish to ghcr.io with the workflow's own token; no password needed

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registries need lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vlsi-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything except the tests that need an Ollama server with the model.
      - name: Test the image
        run: |
          docker run --rm vlsi-agent:ci vlsi-agent check-fixtures
          docker run --rm vlsi-agent:ci python -m pytest -q -p no:cacheprovider -m "not ollama"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
